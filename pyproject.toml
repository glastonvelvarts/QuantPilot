[project]
name = "ocq"
version = "0.1.0"
description = "QuantPilot (OCQ) - terminal LLM quantization optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantPilot contributors" }]
keywords = ["llm", "quantization", "awq", "gptq", "gguf", "nvfp4", "quantpilot", "ocq", "cli"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "huggingface-hub>=0.24",
    "llmfit>=1.1",
]

[project.optional-dependencies]
gguf = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4.21"]
awq = ["llmcompressor>=0.14"]
gptq = ["llmcompressor>=0.14"]
bnb = ["bitsandbytes>=0.45", "torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
nvfp4 = ["llmcompressor>=0.14"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.scripts]
ocq = "ocq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocq"]

# PyPI only ships CPU torch for Windows, so Windows pulls the CUDA build instead.
# It still runs on machines without an NVIDIA card.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a model and runs a real quantization"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
