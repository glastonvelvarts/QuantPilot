[project]
name = "quantpilot"
version = "0.1.0"
description = "Which LLM, format and runtime to run on this PC, measured and explained, and quantizing it (GGUF, AWQ, GPTQ, bitsandbytes, NVFP4)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuantPilot contributors" }]
keywords = ["llm", "quantization", "awq", "gptq", "gguf", "nvfp4", "llama.cpp", "vllm", "quantpilot", "ocq", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "huggingface-hub>=1.0",  # 1.x talks over httpx, whose errors QuantPilot catches
    "llmfit>=1.1",
    "textual>=8.0",
    "platformdirs>=4.12.4",
]

[project.optional-dependencies]
gguf = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4.21"]
awq = ["llmcompressor>=0.14"]
gptq = ["llmcompressor>=0.14"]
bnb = ["bitsandbytes>=0.45", "torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
nvfp4 = ["llmcompressor>=0.14"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/glastonvelvarts/QuantPilot"
Repository = "https://github.com/glastonvelvarts/QuantPilot"
Issues = "https://github.com/glastonvelvarts/QuantPilot/issues"

[project.scripts]
ocq = "ocq.cli:main"
quantpilot = "ocq.cli:main"  # uvx quantpilot

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocq"]

# The source package: exactly these, never a local virtual environment or model outputs.
[tool.hatch.build.targets.sdist]
include = ["src/ocq", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]

# PyPI only ships CPU torch for Windows, so Windows pulls the CUDA build instead.
# It still runs on machines without an NVIDIA card.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a model and runs a real quantization"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
