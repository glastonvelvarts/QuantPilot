[project]
name = "ocq"
version = "0.1.0"
description = "OCQ - One-Click Quantizer, terminal LLM optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OCQ contributors" }]
keywords = ["llm", "quantization", "awq", "gptq", "llmfit", "cli"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
awq = ["autoawq>=0.2"]
gptq = ["auto-gptq>=0.7", "torch>=2.1"]
bnb = ["bitsandbytes>=0.43", "torch>=2.1", "transformers>=4.40"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.scripts]
ocq = "ocq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
