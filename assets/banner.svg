<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">QuantPilot — One-Click Quantizer</title>
  <desc id="desc">Terminal LLM optimizer: inspect, fit, quantize, validate, benchmark.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="1280" height="400" fill="#0a0f1a"/>

  <!-- Hero card -->
  <rect x="60" y="40" width="1160" height="320" rx="24" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="60" y="40" width="1160" height="320" rx="24" fill="url(#glow)"/>

  <!-- Gauge icon -->
  <g transform="translate(250 130)">
    <path d="M 0 90 A 70 70 0 0 1 140 90" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
    <line x1="70" y1="90" x2="118" y2="46" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="90" r="11" fill="#0c1322" stroke="#e2e8f0" stroke-width="5"/>
    <rect x="12" y="130" width="116" height="7" rx="3.5" fill="#334155"/>
    <rect x="12" y="150" width="82" height="7" rx="3.5" fill="#f43f5e"/>
    <rect x="12" y="170" width="116" height="7" rx="3.5" fill="#334155"/>
  </g>

  <!-- Wordmark -->
  <text x="450" y="235" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-4"><tspan fill="#e2e8f0">quant</tspan><tspan fill="url(#accent)">pilot</tspan></text>

  <!-- Tagline -->
  <text x="452" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">One-Click Quantizer — quantize, validate and benchmark LLMs for your PC</text>

  <!-- Terminal prompt -->
  <text x="452" y="334" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#22d3ee">$ ocq optimize &lt;model&gt; --execute</text>
</svg>
