<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">QuantPilot — One-Click Quantizer</title>
  <desc id="desc">Terminal LLM optimizer pipeline: inspect, fit, quantize, validate, benchmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.5"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="80" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-2">QuantPilot</text>
  <rect x="82" y="196" width="180" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="246" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">One-Click Quantizer — quantize, validate and benchmark LLMs for your PC</text>

  <!-- Terminal prompt -->
  <text x="80" y="300" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#22d3ee">$ ocq optimize &lt;model&gt; --execute</text>

  <!-- Pipeline -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <!-- connectors -->
    <g stroke="#334155" stroke-width="2" fill="none">
      <line x1="760" y1="120" x2="820" y2="120"/>
      <line x1="880" y1="120" x2="980" y2="120"/>
      <line x1="1040" y1="120" x2="1140" y2="120"/>
    </g>
    <!-- nodes -->
    <g>
      <rect x="700" y="90" width="60" height="60" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="730" y="128" fill="#e2e8f0">1</text>
      <text x="730" y="178" fill="#94a3b8" font-size="15" font-weight="500">Inspect</text>
    </g>
    <g>
      <rect x="820" y="90" width="60" height="60" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="850" y="128" fill="#e2e8f0">2</text>
      <text x="850" y="178" fill="#94a3b8" font-size="15" font-weight="500">Fit</text>
    </g>
    <g>
      <rect x="980" y="90" width="60" height="60" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="1010" y="128" fill="#e2e8f0">3</text>
      <text x="1010" y="178" fill="#94a3b8" font-size="15" font-weight="500">Quantize</text>
    </g>
    <g>
      <rect x="1140" y="90" width="60" height="60" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="1170" y="128" fill="#e2e8f0">4</text>
      <text x="1170" y="178" fill="#94a3b8" font-size="15" font-weight="500">Validate</text>
    </g>
  </g>
</svg>
