<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">QuantPilot — quantization planner and validator for local LLM inference</title>
  <desc id="desc">Bit-width ladder from FP16 to 2-bit, and the inspect, plan, quantize, validate, benchmark pipeline.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="#fafafa"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.6"/>

  <!-- Left: identity -->
  <text x="72" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#111827" letter-spacing="-1.5">QuantPilot</text>
  <text x="74" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#4b5563">Quantization planner and validator</text>
  <text x="74" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#4b5563">for local LLM inference</text>
  <text x="74" y="262" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" fill="#6b7280">gguf · awq · gptq · bnb</text>
  <text x="74" y="290" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" fill="#6b7280">ocq optimize &lt;model&gt; --execute</text>

  <!-- Right: bit-width ladder -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16">
    <text x="520" y="64" fill="#6b7280">BITS    WEIGHT SIZE (RELATIVE)</text>

    <text x="520" y="104" fill="#111827">FP16</text>
    <rect x="600" y="88" width="600" height="22" rx="3" fill="#cbd5e1"/>

    <text x="520" y="142" fill="#111827">8</text>
    <rect x="600" y="126" width="300" height="22" rx="3" fill="url(#bar)"/>

    <text x="520" y="180" fill="#111827">6</text>
    <rect x="600" y="164" width="225" height="22" rx="3" fill="url(#bar)"/>

    <text x="520" y="218" fill="#111827">5</text>
    <rect x="600" y="202" width="187" height="22" rx="3" fill="url(#bar)"/>

    <text x="520" y="256" fill="#111827">4</text>
    <rect x="600" y="240" width="150" height="22" rx="3" fill="url(#bar)"/>

    <text x="520" y="294" fill="#111827">3</text>
    <rect x="600" y="278" width="112" height="22" rx="3" fill="url(#bar)"/>

    <text x="520" y="332" fill="#111827">2</text>
    <rect x="600" y="316" width="75" height="22" rx="3" fill="url(#bar)"/>
  </g>

  <!-- Bottom: pipeline -->
  <rect x="0" y="352" width="1280" height="48" fill="#111827"/>
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#e5e7eb" text-anchor="middle">
    <text x="130" y="382">analyze</text>
    <text x="320" y="382">plan</text>
    <text x="510" y="382">quantize</text>
    <text x="700" y="382">validate</text>
    <text x="900" y="382">benchmark</text>
    <text x="1120" y="382" fill="#38bdf8">load → generate</text>
  </g>
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <line x1="190" y1="376" x2="262" y2="376"/>
    <line x1="380" y1="376" x2="452" y2="376"/>
    <line x1="570" y1="376" x2="642" y2="376"/>
    <line x1="760" y1="376" x2="832" y2="376"/>
  </g>
</svg>
