<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">QuantPilot — One-Click Quantizer</title>
  <desc id="desc">Terminal LLM optimizer: inspect the PC, pick a quantization, get a quantized, validated, benchmarked artifact.</desc>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="#070b14"/>
  <rect width="1280" height="400" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1010" cy="170" r="420" fill="url(#halo)"/>

  <!-- Left: identity -->
  <text x="80" y="118" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="600" fill="#38bdf8" letter-spacing="3">OCQ · ONE-CLICK QUANTIZER</text>
  <text x="76" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="96" font-weight="800" fill="url(#wordmark)" letter-spacing="-3">QuantPilot</text>
  <text x="80" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="26" font-weight="500" fill="#94a3b8">Terminal LLM optimizer for your PC.</text>
  <text x="80" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="26" font-weight="500" fill="#94a3b8">Quantize, validate and benchmark.</text>

  <!-- Right: real result card -->
  <g transform="translate(748 64)">
    <rect width="460" height="252" rx="14" fill="#0d1424" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="6" fill="#ef4444"/>
    <circle cx="46" cy="26" r="6" fill="#eab308"/>
    <circle cx="66" cy="26" r="6" fill="#22c55e"/>
    <line x1="0" y1="50" x2="460" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <g font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18">
      <text x="28" y="92" fill="#94a3b8">$ <tspan fill="#e2e8f0">ocq optimize Qwen2.5-0.5B --execute</tspan></text>
      <text x="28" y="134" fill="#64748b">quantized   </text><text x="200" y="134" fill="#e2e8f0">GGUF Q4_K_M (4-bit)</text>
      <text x="28" y="166" fill="#64748b">size        </text><text x="200" y="166" fill="#e2e8f0">0.37 GB</text><text x="290" y="166" fill="#64748b">was 0.92 GB</text>
      <text x="28" y="198" fill="#64748b">validation  </text><text x="200" y="198" fill="#4ade80" font-weight="700">PASS</text>
      <text x="28" y="230" fill="#64748b">speed       </text><text x="200" y="230" fill="#38bdf8">186.7 tok/s</text><text x="350" y="230" fill="#64748b">TTFT 50 ms</text>
    </g>
  </g>

  <!-- Bottom: pipeline -->
  <line x1="80" y1="340" x2="1200" y2="340" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="1200" y2="340" stroke="url(#flow)" stroke-width="2" opacity="0.6"/>
  <g font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#cbd5e1">
    <circle cx="80" cy="340" r="6" fill="#38bdf8"/>
    <text x="80" y="374">inspect</text>
    <circle cx="300" cy="340" r="6" fill="#38bdf8"/>
    <text x="300" y="374">plan</text>
    <circle cx="500" cy="340" r="6" fill="#38bdf8"/>
    <text x="500" y="374">quantize</text>
    <circle cx="710" cy="340" r="6" fill="#818cf8"/>
    <text x="710" y="374">validate</text>
    <circle cx="930" cy="340" r="6" fill="#818cf8"/>
    <text x="930" y="374">benchmark</text>
  </g>
</svg>
